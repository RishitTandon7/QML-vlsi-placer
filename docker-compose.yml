version: '3.8'

services:
  qml-placer:
    build:
      context: .
      dockerfile: Dockerfile
    image: qml-or-sky130:latest
    container_name: qml-placer-container

    # ── Ports ──────────────────────────────────────────────────────────────────
    ports:
      - "6080:6080"   # noVNC → open http://localhost:6080/vnc.html in browser
      - "5900:5900"   # Raw VNC (for VNC client apps)

    # ── Environment ────────────────────────────────────────────────────────────
    environment:
      - DISPLAY=:99
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1080
      - SCREEN_DEPTH=24
      - VNC_PORT=5900
      - NOVNC_PORT=6080
      - PDK_ROOT=/opt/pdk
      - OPENROAD_HOME=/opt/openroad
      - PYTHONUNBUFFERED=1
      - QT_QPA_PLATFORM=xcb
      - QT_LOGGING_RULES=*.debug=false

    # ── Volume mounts (live-reload without rebuild) ─────────────────────────────
    volumes:
      - ./designs:/workspace/designs
      - ./results:/workspace/results
      - ./checkpoints:/workspace/checkpoints
      - ./configs:/workspace/configs
      - ./core:/workspace/core
      - ./ui:/workspace/ui
      - ./tcl:/workspace/tcl
      - qml_logs:/workspace/logs

    # ── Resource limits ────────────────────────────────────────────────────────
    # Uncomment the `deploy` block ONLY if you have an NVIDIA GPU + nvidia-container-toolkit
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [compute, utility]

    stdin_open: true
    tty: true
    restart: unless-stopped

    # ── Health check ──────────────────────────────────────────────────────────
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "6080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - qml-network

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  qml_logs:

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  qml-network:
    driver: bridge
